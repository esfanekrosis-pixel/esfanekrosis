<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Train des Animaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
:root {
  /* Layout: a storybook page; one full-bleed canvas drawn in felt-pen and crayon, DOM only for the ticket, the question banner, the arrow keys and the album. */
  --ink: #3b2f4a;
  --ink-soft: #75688a;
  --paper: #fbf3e2;
  --paper-deep: #f1e2c2;
  --berry: #e8536b;
  --leaf: #4cb944;
  --sun: #ffc93c;
  --sky: #a8d8f0;
  --font-hand: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", ui-rounded, system-ui, sans-serif;
  --wobble: 18px 12px 20px 14px / 13px 19px 12px 17px;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--font-hand);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 4px dashed var(--berry); outline-offset: 4px; }
.tnum { font-variant-numeric: tabular-nums; }
.paper {
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); border-radius: var(--wobble); box-shadow: 4px 5px 0 var(--ink);
}

/* parents' corner */
#corner {
  position: fixed; z-index: 5; display: flex; gap: 10px;
  top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 14px);
}
.chip {
  height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 22px;
}
.chip svg { width: 22px; height: 22px; }
.chip.bump { animation: bump .6s ease 3; }

/* question banner */
#banner {
  position: fixed; z-index: 4; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px);
  transform: translate(-50%, -180%); transition: transform .45s cubic-bezier(.34, 1.56, .64, 1);
  display: flex; align-items: center; gap: 12px; padding: 4px 22px 4px 10px;
  width: max-content; max-width: min(calc(100vw - 340px), 760px); min-height: 60px;
  font-size: clamp(22px, 3.3vw, 38px); line-height: 1.05; text-wrap: balance; pointer-events: none;
}
#banner.show { transform: translate(-50%, 0); }
#banner img { width: 1.9em; height: 1.9em; flex: none; }
@media (max-width: 860px) {
  #banner { top: calc(env(safe-area-inset-top, 0px) + 68px); max-width: calc(100vw - 32px); }
}

/* arrow keys */
#pad {
  --k: clamp(42px, min(8.5vmin, 9vh), 70px);
  position: fixed; z-index: 5; display: grid; gap: 7px;
  grid-template-columns: repeat(3, var(--k)); grid-template-rows: repeat(2, var(--k));
  grid-template-areas: ". u ." "l d r";
  right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
}
.key {
  display: grid; place-items: center; padding: 0; cursor: pointer;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 13px 17px 12px 16px / 16px 12px 17px 13px;
  box-shadow: 0 5px 0 var(--ink); transition: transform .06s, box-shadow .06s, background-color .1s;
}
.key svg { width: calc(var(--k) * .55); height: calc(var(--k) * .55); }
.key[data-k="u"] { grid-area: u; } .key[data-k="l"] { grid-area: l; }
.key[data-k="d"] { grid-area: d; } .key[data-k="r"] { grid-area: r; }
.key.hint { animation: keyhint .9s ease-in-out infinite; }
.key.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); background: var(--sun); animation: none; }

/* ticket */
#title {
  position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding-block: 16px; padding-inline: 16px; cursor: pointer;
}
.ticket {
  display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: min(580px, 100%);
  padding: 14px 26px 16px; transform: rotate(-2deg); box-shadow: 7px 8px 0 var(--ink);
}
.ticket-row {
  display: flex; justify-content: space-between; gap: 18px; width: 100%;
  font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
}
.ticket-row.bottom {
  border-top: 3px dashed var(--ink-soft); padding-top: 8px; font-size: 19px; letter-spacing: .02em; text-transform: none;
}
.ticket h1 {
  margin: 0; font-weight: 400; line-height: .9; text-align: center; text-wrap: balance;
  font-size: clamp(44px, min(10vw, 13vh), 100px);
}
.ticket h1 span { display: block; color: var(--berry); }
.go { display: flex; align-items: center; gap: 14px; font-size: clamp(20px, 3vw, 28px); }
.go .keycap {
  width: clamp(76px, 15vmin, 120px); aspect-ratio: 1; display: grid; place-items: center; cursor: pointer;
  background: var(--sun); border: 3px solid var(--ink); border-radius: 18px 24px 16px 22px / 22px 16px 24px 18px;
  box-shadow: 0 7px 0 var(--ink); animation: pulse 1.2s ease-in-out infinite;
}
.go .keycap svg { width: 60%; height: 60%; }
.hint { margin: 0; padding: 4px 16px; font-size: 19px; text-align: center; }

#encore {
  position: fixed; z-index: 5; right: calc(env(safe-area-inset-right, 0px) + 22px); top: 42%; translate: 0 -50%;
  display: flex; align-items: center; gap: 10px; padding: 10px 22px 10px 12px; cursor: pointer;
  background: var(--leaf); color: var(--paper); font-size: clamp(24px, 3.6vmin, 34px);
  animation: pulse 1.2s ease-in-out infinite;
}
#encore .keycap {
  width: 1.8em; height: 1.8em; display: grid; place-items: center; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 10px 13px 9px 12px;
}
#encore .keycap svg { width: 62%; height: 62%; }

/* album */
#album {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(59, 47, 74, .55);
}
.book { width: min(960px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; padding: 14px 20px 20px; }
.book header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.book h2 { margin: 0; font-weight: 400; font-size: clamp(30px, 4.4vw, 44px); }
.book h2 small { margin-left: 8px; font-size: .6em; color: var(--ink-soft); }
.book h3 { margin: 18px 0 8px; font-weight: 400; font-size: 24px; }
.close { padding: 6px 18px; cursor: pointer; background: var(--berry); color: var(--paper); font-size: 24px; }
.skills { display: flex; flex-wrap: wrap; gap: 8px; }
.skill { padding: 4px 12px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; font-size: 18px; }
.skill b { font-weight: 400; color: var(--berry); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.sticker {
  min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 6px 4px 4px; cursor: pointer;
  background: #fff; border: 2px solid var(--ink); border-radius: 14px 18px 13px 17px; box-shadow: 2px 3px 0 var(--ink);
}
.sticker img { width: 64px; height: 64px; }
.sticker .nm { min-height: 1.2em; font-size: 17px; line-height: 1.1; text-align: center; }
.sticker.locked { background: var(--paper-deep); box-shadow: none; }
.sticker.locked img { filter: brightness(0) opacity(.18); }
.sticker.wiggle { animation: wiggle .5s ease; }

@keyframes pulse { 50% { transform: scale(1.07); } }
@keyframes bump { 50% { transform: scale(1.2); } }
@keyframes wiggle { 25% { transform: rotate(-8deg) scale(1.1); } 75% { transform: rotate(8deg) scale(1.1); } }
@keyframes keyhint { 50% { background: var(--sun); transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) {
  .go .keycap, #encore, .chip.bump, .sticker.wiggle, .key.hint { animation: none; }
  .key.hint { background: var(--sun); }
  #banner { transition: none; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Un petit train dessiné roule dans la campagne. Utilise les flèches du clavier pour jouer."></canvas>

<div id="corner">
  <button class="chip paper" id="albumBtn" type="button" aria-label="Ouvrir l’album des animaux"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5c3-1.5 6-1.5 9 .5 3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 6v13.5"/></svg><span class="tnum" id="albumCount">0/40</span></button>
  <button class="chip paper" id="soundBtn" type="button" aria-label="Couper le son"></button>
  <button class="chip paper" id="fsBtn" type="button" aria-label="Plein écran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="banner" class="paper" aria-live="polite"><img id="bannerImg" alt="" hidden><span id="bannerTx"></span></div>

<div id="pad" aria-label="Les flèches du clavier">
  <button class="key" type="button" data-k="u" aria-label="Flèche du haut"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 4 12.5h5V20.5h6V12.5h5z" fill="#3b2f4a" stroke="#3b2f4a" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  <button class="key" type="button" data-k="l" aria-label="Flèche de gauche"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12 12.5 4v5h8v6h-8v5z" fill="#3b2f4a" stroke="#3b2f4a" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  <button class="key" type="button" data-k="d" aria-label="Flèche du bas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5 4 11.5h5V3.5h6v8h5z" fill="#3b2f4a" stroke="#3b2f4a" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  <button class="key" type="button" data-k="r" aria-label="Flèche de droite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12 11.5 4v5h-8v6h8v5z" fill="#3b2f4a" stroke="#3b2f4a" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
</div>

<div id="title">
  <div class="ticket paper">
    <div class="ticket-row"><span>Billet</span><span class="tnum" id="tkTrip">Voyage n° 1</span></div>
    <h1>Le Train <span>des Animaux</span></h1>
    <div class="go"><button class="keycap" id="playBtn" type="button" aria-label="Partir en voyage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12 11.5 4v5h-8v6h8v5z" fill="#3b2f4a" stroke="#3b2f4a" stroke-width="1.6" stroke-linejoin="round"/></svg></button><span>pour partir !</span></div>
    <div class="ticket-row bottom"><span>Aller simple · gare de la Fête</span><span class="tnum" id="tkAlbum">0 / 40 amis</span></div>
  </div>
  <p class="hint paper">Appuie sur la flèche de droite du clavier</p>
</div>

<button id="encore" class="paper" type="button" hidden><span class="keycap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12 11.5 4v5h-8v6h8v5z" fill="#3b2f4a"/></svg></span><span>Encore !</span></button>

<div id="album" role="dialog" aria-modal="true" aria-labelledby="albumTitle" hidden>
  <div class="book paper">
    <header>
      <h2 id="albumTitle">Mon album <small class="tnum" id="albumTotal"></small></h2>
      <button class="close paper" id="closeAlbum" type="button">Retour au train</button>
    </header>
    <h3>Ce que j’apprends</h3>
    <div class="skills" id="skills"></div>
    <h3>Mes amis</h3>
    <div class="grid" id="grid"></div>
  </div>
</div>

<noscript>Ce jeu a besoin de JavaScript.</noscript>

<script src="voice.js"></script>

    let r = Math.random() * ws.reduce((x, y) => x + y, 0), i = 0;

    const o = pickOther(a, type === 'sound' ? SOUND_Q : FAMILIAR), cry = type === 'sound' ? a.s.replace(/ !$/, '') : '';
    put({ kind: 'animal', id: a.id }, { kind: 'animal', id: o.id }, low(a.n), low(o.n));
    q.text = type === 'name' ? `Où est ${low(a.n)} ?` : `Qui fait « ${low(cry)} » ?`;
    q.speech = type === 'name' ? q.text : `Qui fait ${cry} ?`;
    q.skill = 'animaux'; q.from = 'card';
  } else if (type === 'color') {
    const [c1, c2] = shuffle(COLORS.slice());
    put({ kind: 'balloon', color: c1.c }, { kind: 'balloon', color: c2.c }, `le ballon ${c1.name}`, `le ballon ${c2.name}`);
    q.text = `Où est le ballon ${c1.name} ?`; q.speech = `${a.n}|veut le ballon ${c1.name}.|${q.text}`;
    q.skill = 'couleurs'; q.deco = { kind: 'balloon', color: c1.c };
  } else if (type === 'count') {
    const max = G.trips >= 2 ? 5 : 3, food = pick(COUNTABLE), F = FOODS[food], n = irnd(2, max);
    let m; do { m = irnd(1, max); } while (m === n);
    const word = k => k === 1 ? `${F.f ? 'une seule' : 'un seul'} ${F.sg}` : `${NUM[k]} ${F.pl}`;
    put({ kind: 'count', n, food, hl: 0 }, { kind: 'count', n: m, food, hl: 0 }, word(n), word(m));
    q.text = `Où sont les ${word(n)} ?`; q.speech = `${a.n}|veut ${word(n)}.|${q.text}`;
    q.skill = 'nombres'; q.countN = n; q.deco = { kind: 'food', food };
  } else if (type === 'shape') {
    const [s1, s2] = shuffle(Object.keys(SHAPES)), [c1, c2] = shuffle(COLORS.slice());
    put({ kind: 'shape', shape: s1, color: c1.c }, { kind: 'shape', shape: s2, color: c2.c }, SHAPES[s1], SHAPES[s2]);
    q.text = `Où est ${SHAPES[s1]} ?`; q.speech = `${a.n}|cherche ${SHAPES[s1]}.|${q.text}`;
    q.skill = 'formes'; q.deco = { kind: 'shape', shape: s1, color: c1.c };
  } else if (type === 'size') {
    const big = Math.random() < 0.5, art = a.f ? 'la' : 'le', g = a.f ? 'grande' : 'grand', p = a.f ? 'petite' : 'petit';
    put({ kind: 'animal', id: a.id, scale: big ? 1 : 0.55 }, { kind: 'animal', id: a.id, scale: big ? 0.55 : 1 }, `${art} ${big ? g : p} ${a.noun}`, `${art} ${big ? p : g} ${a.noun}`);
    q.text = `Où est ${labels[side]} ?`; q.speech = q.text;
    q.skill = 'tailles'; q.from = 'card';
  } else {
    const good = EATS[a.id], bad = pick(MEAT_EATERS.has(a.id) ? ['carotte', 'banane', 'herbe'] : ['os', 'poisson']);
    put({ kind: 'food', food: good }, { kind: 'food', food: bad }, FOODS[good].art, FOODS[bad].art);
    q.text = `Qu’est-ce que mange ${low(a.n)} ?`; q.speech = `${a.n}|a faim !|Qu’est-ce qu’${a.f ? 'elle' : 'il'} mange ?`;
    q.skill = 'manger'; q.deco = { kind: 'food', food: good };
  }
  items.forEach((it, i) => { it.seed = Math.round(st.wx) % 97 + i * 7; it.flip = i === 1; });
  return q;
}

/* ---------- game flow ---------- */
function startGame() {
  if (G.state !== 'title') return;
  unlock(); wakeLock();
  titleEl.hidden = true;
  G.state = 'ride';
  planRoute();
  say('C’est parti !'); SFX.whistle(); puff();
  if (!G.tips.r) later(4, () => { G.tips.r = true; if (!G.pressedR && G.state === 'ride') { say('Appuie sur la flèche de droite pour aller plus vite !', true); flashHint(['r']); } });
  if (!G.tips.u) later(12, () => { G.tips.u = true; if (!G.pressedU && G.state === 'ride') { say('La flèche du haut, c’est le sifflet !', true); flashHint(['u']); } });
}

function arrive() {
  const o = G.target;
  if (o.type === 'dest') { startParty(); return; }
  G.waitT = 0;
  if (o.type === 'obstacle') {
    G.state = 'blocked'; SFX.brake();
    showBanner(o.animal.id, 'Siffle avec la flèche du haut !');
    say(`Oh !|${o.animal.n}|est sur les rails !|Siffle avec la flèche du haut !`);
    setHint(['u']);
    return;
  }
  G.state = 'quiz'; G.q = makeQuestion(o); SFX.bell();
  showBanner(G.q.from === 'card' ? null : o.animal.id, G.q.text);
  // Every question ends with which arrows to use, so a child can play just by listening.
  later(0.5, () => { if (G.q && !G.q.done) say(G.q.speech + '|Flèche de gauche, ou flèche de droite ?'); });
  if (!G.tips.lr) { G.tips.lr = true; setHint(['l', 'r']); }
}

function answer(side) {
  const q = G.q;
  if (!q || q.done) return;
  q.idle = 0;
  if (side !== q.answer) {
    q.tries++; q.shake[side] = 1; SFX.wrong();
    const lab = q.labels[side];
    if (q.type === 'count') {
      const it = q.items[side], m = it.n;
      it.hl = 0;
      for (let i = 1; i <= m; i++) later(0.9 + i * 0.5, () => { it.hl = i; });
      say(`Non, là il y a ${lab}.${m > 1 ? `|On compte : ${NUM.slice(1, m + 1).join(', ')}.` : ''}|Essaie de l’autre côté !`);
    } else say(`Non, ça c’est ${lab}.|Essaie de l’autre côté !`);
    setHint([q.answer ? 'r' : 'l']);
    return;
  }
  q.done = true; q.pop[side] = 1; clearHint(); SFX.right();
  G.stats[q.skill] = (G.stats[q.skill] || 0) + 1; save();
  const lay = cardLayout();
  confettiBurst(lay.xs[side], lay.cy, 24);
  const where = side ? 'à droite' : 'à gauche';
  let wait = 1.6;
  if (q.type === 'count') {
    say('Bravo !|' + NUM.slice(1, q.countN + 1).join(', ') + ' !');
    for (let i = 1; i <= q.countN; i++) later(0.45 + i * 0.55, () => { q.items[side].hl = i; SFX.sparkle(); });
    wait = 1.4 + q.countN * 0.55;
  } else if (q.type === 'food') say(`Miam !|${q.a.n}|adore ${FOODS[q.items[side].food].love} !`);
  else if (q.type === 'name' || q.type === 'sound') say(`Bravo !|C’est ${low(q.a.n)} !|C’était ${where} !`);
  else say(`Bravo !|C’était ${where} !`);
  later(wait, board);
}

function board() {
  const o = G.target, q = G.q, k = G.wagons.findIndex(w => !w.animal);
  if (!o || o.type !== 'station' || k < 0 || G.fly) return;
  G.state = 'board'; o.done = true;
  let x0 = o.wx, y0 = -36, h0 = 92;
  if (q && q.from === 'card') {
    const lay = cardLayout(), [bx0, bx1, by0, by1] = fullBounds(o.animal.id), sc = q.items[q.answer].scale || 1;
    x0 = camX + lay.xs[q.answer] / S; y0 = (lay.cy + lay.c * 0.24 - GY) / S;
    h0 = Math.min(lay.c * 0.62, lay.c * 0.84 * (by1 - by0) / (bx1 - bx0)) * sc / S;
  }
  if (q) q.leave = 0.001;
  G.fly = { a: o.animal, k, x0, y0, h0, x1: wagonCenter(k), y1: -40, t: 0, dur: RM ? 0.6 : 1.1, deco: q && q.deco };
  SFX.boing(); hideBanner();
}

function land() {
  const f = G.fly; G.fly = null; G.q = null;
  const w = G.wagons[f.k]; w.animal = f.a; w.deco = f.deco; w.squash = 1;
  sparkleBurst(f.x1, -110, 16); SFX.land();
  if (!G.seen.has(f.a.id)) { G.seen.add(f.a.id); G.newFound.push(f.a); save(); updateAlbumChip(true); }
  const full = G.wagons.every(x => x.animal);
  say(talk(f.a), true);
  later(1.1, () => depart(full ? 'Tout le monde est là ! En route pour la fête !' : null));
}
function depart(line) {
  G.target = G.route[G.route.indexOf(G.target) + 1];
  G.state = 'ride'; SFX.whistle(); puff();
  if (line) say(line, true);
}
function clearObstacle() {
  const o = G.target;
  o.cleared = true; o.away = 0.001;
  clearHint(); hideBanner(); toot();
  say(`Merci !|${talk(o.animal)}`);
  later(1.3, () => depart(null));
}

function startParty() {
  G.state = 'party'; G.partyT = 0; G.fwT = 1; G.confAcc = 0; G.trips++; save(); updateTicket();
  SFX.fanfare(); showBanner(null, 'C’est la fête !');
  const n = G.wagons.length;
  G.wagons.forEach((w, i) => later(0.8 + i * 0.75, () => {
    if (!w.animal) return;
    const a = w.animal; w.animal = null;
    G.dancers.push({ a, i, x0: wagonCenter(i), y0: -40, x1: camX + (W * 0.74 * (i + 1) / (n + 1)) / S, y1: Math.min(FG * 0.78, FG - 12), t: 0, dur: 0.8, hop: 0 });
    SFX.boing(0.8); say(NUM[i + 1], true);
  }));
  later(1.2 + n * 0.75, () => {
    if (G.state !== 'party') return;
    say(`${NUM[n]} amis dans le train !|Youpi, c’est la fête !`, true);
    if (G.newFound.length) showBanner(G.newFound[0].id, G.newFound.length > 1 ? `${G.newFound.length} nouveaux amis dans l’album !` : 'Un nouvel ami dans l’album !');
  });
  spawnBalloons(7);
}
function nextTrip() {
  if (G.iris) return;
  encoreBtn.hidden = true; hideBanner(); clearHint();
  G.iris = { phase: 'close', t: 0 };
  SFX.whistle();
}
function swapTrip() {
  G.dancers = []; G.balloons = []; G.confetti = []; G.fireworks = []; G.sparks = []; G.smoke = []; G.fish = []; G.birds = []; G.timers = [];
  G.trainPos = 0; G.speed = 0; G.q = null; G.fly = null;
  setupTrip();
  planRoute();
  G.state = 'ride';
  later(0.3, () => { say(G.biome.label); SFX.whistle(); });
}

/* ---------- little reactions ---------- */
function puff() {
  for (let i = 0; i < 5; i++) G.smoke.push({ x: G.trainPos - 51 + rnd(-6, 6), y: -180, vx: rnd(-40, 30), vy: rnd(-110, -60), r: rnd(14, 22), life: 0, max: rnd(1.4, 2), sd: rnd(1000) | 0 });
}
function toot() {
  puff();
  if (G.t - G.lastToot > 0.5) { G.lastToot = G.t; SFX.whistle(); }
}
function sayThrottled(text, gap = 0.6) { if (G.t - G.lastSay > gap) { G.lastSay = G.t; say(text); } }
function nag(text, keys) { if (G.t - G.lastNag > 2.5) { G.lastNag = G.t; say(text); } setHint(keys); }
function sparkleBurst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), sp = rnd(80, 220);
    G.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0, max: rnd(0.6, 1), c: pick(['#ffd23f', '#ffffff', '#ff8fab', '#8fd3ff']), r: rnd(7, 12), sd: i });
  }
}
function confettiBurst(x, y, n, c) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), sp = rnd(120, 320);
    G.confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140, rot: rnd(TAU), vr: rnd(-8, 8), c: c || pick(PARTY_COLORS), w: rnd(7, 11), h: rnd(10, 15), life: 0, max: 2.4 });
  }
}
function spawnBalloons(n) {
  for (let i = 0; i < n; i++) G.balloons.push({ x: rnd(W * 0.1, W * 0.7), y: H + rnd(30, 300), r: clamp(30 * S, 22, 56), c: pick(PARTY_COLORS), vy: rnd(45, 80) * Math.max(0.7, S), ph: rnd(TAU), sd: i * 13 });
}
function popOne(dir) {
  if (!G.balloons.length) { spawnBalloons(4); confettiBurst(dir === 'l' ? W * 0.2 : W * 0.5, H * 0.5, 16); SFX.sparkle(); return; }
  const b = G.balloons.reduce((m, x) => (dir === 'l' ? x.x < m.x : x.y > m.y) ? x : m);
  G.balloons.splice(G.balloons.indexOf(b), 1);
  confettiBurst(b.x, b.y, 18, b.c); SFX.pop();
}
function firework() {
  const cx = rnd(W * 0.12, W * 0.7), cy = rnd(GY * 0.15, GY * 0.5), c = pick(PARTY_COLORS);
  const n = RM ? 12 : 24, sp = rnd(110, 170) * Math.max(S, 0.7);
  for (let i = 0; i < n; i++) { const a = i / n * TAU, k = rnd(0.85, 1); G.fireworks.push({ x: cx, y: cy, vx: Math.cos(a) * sp * k, vy: Math.sin(a) * sp * k, life: 0, max: rnd(1, 1.4), c }); }
  SFX.firework();
}

/* ---------- arrow keys ---------- */
function press(dir) {
  initAudio();
  if (!albumEl.hidden) return;
  if (G.state === 'title') { startGame(); return; }
  if (G.iris) return;
  if (dir === 'r') G.pressedR = true;
  if (dir === 'u') G.pressedU = true;
  if (G.state === 'quiz') {
    if (dir === 'l') answer(0); else if (dir === 'r') answer(1); else nag('Flèche de gauche, ou flèche de droite ?', ['l', 'r']);
  } else if (G.state === 'blocked') {
    if (dir === 'u') clearObstacle(); else nag('La flèche du haut !', ['u']);
  } else if (G.state === 'party') {
    if (dir === 'r' && G.partyT > 3) nextTrip();
    else if (dir === 'u' || dir === 'r') firework();
    else popOne(dir);
  } else {
    if (dir === 'u') toot();
    else if (dir === 'd') { SFX.bell(); G.bellT = 1; }
    else if (G.state === 'ride' && dir === 'r') { puff(); if (G.t - G.lastSay > 7) sayThrottled(pick(['Plus vite !', 'Vroum !', 'Tchou tchou !'])); }
    else if (G.state === 'ride' && dir === 'l') { SFX.brake(); if (G.t - G.lastSay > 7) sayThrottled('Doucement…'); }
  }
}

/* ---------- update ---------- */
function update(dt) {
  G.t += dt;
  BOIL = RM ? 0 : Math.floor(G.t * 7);
  if (G.timers.length) {
    const due = [];
    G.timers = G.timers.filter(tm => { tm.t -= dt; if (tm.t <= 0) { due.push(tm); return false; } return true; });
    due.forEach(tm => tm.fn());
  }

  // train
  if (G.state === 'title') {
    G.speed += (110 - G.speed) * Math.min(1, dt);
    G.trainPos += G.speed * dt;
  } else if (G.state === 'ride' && G.target) {
    const stopAt = stopPoint(G.target);
    if (G.held.l) G.speed = Math.max(0, G.speed - 320 * dt);
    else G.speed += ((G.held.r ? FAST : CRUISE) - G.speed) * Math.min(1, dt * (G.held.r ? 1.4 : 0.9));
    G.speed = Math.min(G.speed, Math.sqrt(2 * BRAKE * Math.max(0, stopAt - G.trainPos)) + 4);
    G.trainPos = Math.min(stopAt, G.trainPos + G.speed * dt);
    if (stopAt - G.trainPos < 0.5) { G.trainPos = stopAt; G.speed = 0; arrive(); }
  } else {
    G.speed = 0;
  }
  if (G.speed > 12) {
    G.chugD += G.speed * dt;
    if (G.chugD > 74) { G.chugD = 0; SFX.chug(G.chugN++ % 2 === 0, G.speed); }
  }

  // smoke
  G.smokeAcc += dt * (1.2 + G.speed / 50);
  while (G.smokeAcc > 1) {
    G.smokeAcc -= 1;
    G.smoke.push({ x: G.trainPos - 51 + rnd(-4, 4), y: -178, vx: rnd(-14, 6), vy: rnd(-50, -30), r: rnd(9, 14), life: 0, max: rnd(1.6, 2.4), sd: rnd(1000) | 0 });
  }
  for (const p of G.smoke) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy *= 1 - dt * 0.3; p.r += dt * 16; }
  G.smoke = G.smoke.filter(p => p.life < p.max);

  // stops
  const q = G.q;
  if (q) {
    q.t += dt; q.idle += dt;
    for (let i = 0; i < 2; i++) { q.shake[i] = Math.max(0, q.shake[i] - dt * 2.5); q.pop[i] = Math.max(0, q.pop[i] - dt * 1.5); }
    if (q.leave) q.leave += dt * 2.5;
    if (!q.done && q.idle > 9) { q.idle = 0; say(q.speech + '|Flèche de gauche, ou flèche de droite ?'); setHint(['l', 'r']); }
  }
  if (G.state === 'blocked') {
    G.waitT += dt;
    if (G.waitT > 8) { G.waitT = 0; say('Siffle avec la flèche du haut !'); setHint(['u']); }
  }
  for (const o of G.objects) {
    if (o.hopT > 0) o.hopT = Math.max(0, o.hopT - dt);
    if (o.away > 0 && o.away < 1) o.away = Math.min(1, o.away + dt * 0.9);
  }
  if (G.fly) { G.fly.t += dt; if (G.fly.t >= G.fly.dur) land(); }
  for (const w of G.wagons) { w.hop = Math.max(0, w.hop - dt * 2); w.squash = Math.max(0, w.squash - dt * 2.5); }
  G.bellT = Math.max(0, (G.bellT || 0) - dt * 1.2);

  // party
  if (G.state === 'party') {
    G.partyT += dt;
    G.fwT -= dt; if (G.fwT <= 0) { G.fwT = rnd(0.8, 1.5); firework(); }
    G.confAcc += dt * (G.partyT < 4 ? (RM ? 5 : 20) : 4);
    while (G.confAcc > 1) {
      G.confAcc -= 1;
      G.confetti.push({ x: rnd(W), y: -10, vx: rnd(-30, 30), vy: rnd(40, 120), rot: rnd(TAU), vr: rnd(-6, 6), c: pick(PARTY_COLORS), w: rnd(7, 11), h: rnd(10, 15), life: 0, max: 9 });
    }
    if (G.partyT > 3 && encoreBtn.hidden && !G.iris) { encoreBtn.hidden = false; setHint(['r']); }
    if (G.partyT > 30) nextTrip();
  }
  for (const d of G.dancers) { d.t += dt; d.hop = Math.max(0, d.hop - dt * 2); }

  // along the line
  for (const o of G.objects) {
    if (o.type === 'tunnel') {
      if (!o.in && G.trainPos > o.wx) { o.in = true; SFX.whistle(); say('Il fait tout noir !'); }
      if (!o.out && G.trainPos > o.wx + o.len + 10) { o.out = true; say('Coucou !'); }
    } else if (o.type === 'bridge' && wsx(o.wx) < W && wsx(o.wx + o.len) > 0) {
      o.fishT -= dt;
      if (o.fishT <= 0) {
        o.fishT = rnd(0.8, 1.8);
        G.fish.push({ x: rnd(o.wx + 40, o.wx + o.len - 40), t: 0, dur: rnd(0.8, 1.1), h: rnd(60, 95), dir: Math.random() < 0.5 ? -1 : 1, c: pick(['#ff9f43', '#ffd23f', '#ff7eb6']) });
      }
    }
  }
  for (const f of G.fish) f.t += dt;
  G.fish = G.fish.filter(f => f.t < f.dur);

  // particles
  for (const s of G.sparks) { s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * dt; }
  G.sparks = G.sparks.filter(s => s.life < s.max);
  for (const c of G.confetti) {
    c.life += dt; c.vy = Math.min(c.vy + 320 * dt, 160); c.vx *= 1 - dt * 0.8;
    c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
  }
  G.confetti = G.confetti.filter(c => c.life < c.max && c.y < H + 30);
  for (const b of G.balloons) { b.y -= b.vy * dt; b.x += Math.sin(G.t * 1.6 + b.ph) * 16 * dt; }
  G.balloons = G.balloons.filter(b => b.y > -b.r * 4);
  for (const f of G.fireworks) {
    f.life += dt; f.vy += 70 * dt; f.vx *= 1 - dt * 1.2; f.vy *= 1 - dt * 1.2; f.x += f.vx * dt; f.y += f.vy * dt;
  }
  G.fireworks = G.fireworks.filter(f => f.life < f.max);

  // sky life
  if (!G.biome.night) {
    G.birdT -= dt;
    if (G.birdT <= 0) { G.birdT = rnd(9, 18); G.birds.push({ x: W + 40, y: rnd(GY * 0.12, GY * 0.4), n: 3 + (Math.random() * 3 | 0), v: rnd(45, 75) }); }
  }
  for (const b of G.birds) b.x -= (b.v + G.speed * S * 0.08) * dt;
  G.birds = G.birds.filter(b => b.x > -260);
  for (const f of G.flakes) {
    f.y += (25 + f.r * 10) * f.s * dt; f.x -= (G.speed * S * 0.4 + 10) * dt + Math.sin(G.t + f.ph) * 6 * dt;
    if (f.y > H + 5) { f.y = -5; f.x = rnd(W); }
    if (f.x < -5) f.x += W + 10;
  }
  for (const f of G.flies) { f.x = mod(f.x + (f.vx - G.speed * S * 0.5) * dt, W); f.y += Math.sin(G.t * 1.3 + f.ph) * 10 * dt; }
  G.sunAng += dt * 0.15;

  if (G.iris) {
    G.iris.t += dt;
    if (G.iris.t >= (RM ? 0.25 : 0.75)) {
      if (G.iris.phase === 'close') { swapTrip(); G.iris = { phase: 'open', t: 0 }; } else G.iris = null;
    }
  }
  const first = G.objects[0];
  if (first && first !== G.target && first.wx + (first.len || 0) + 900 < camX) G.objects.shift();
}

/* ---------- drawing: sky and land ---------- */
function toWorld() { ctx.setTransform(DPR * S, 0, 0, DPR * S, -camX * S * DPR, GY * DPR); CUR = S; }
function toScreen() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); CUR = 1; }
const SOFT = 'rgba(59,47,74,.45)';

    else { const el = d.documentElement, p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { /* not allowed here */ }
  fsBtn.blur();
});
// Touch only counts as a user gesture on release, so sound is unlocked there too.
['pointerup', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, unlock, true));
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) { if (AC.suspend) AC.suspend(); }
  else { initAudio(); if (G.state !== 'title') wakeLock(); }
});
window.addEventListener('resize', relayout);
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.querySelector('#title .hint').textContent = 'Touche la flèche jaune pour partir';

/* ---------- boot ---------- */
let last = 0;
function frame(ts) {
  const now = ts / 1000, dt = last ? Math.min(0.05, now - last) : 0.016; last = now;
  if (!G.paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
function boot() {
  makeTextures();
  const saved = load();
  (saved.seen || []).forEach(id => { if (AN[id]) G.seen.add(id); });
  G.trips = saved.trips | 0; G.stats = saved.stats || {};
  setMuted(!!saved.muted);
  setupTrip('ferme'); initClouds();
  updateAlbumChip(false); updateTicket();
  if (document.fonts && document.fonts.load) document.fonts.load('26px "Patrick Hand"').catch(() => {});
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) try { hot.snapshot(() => ({ trips: G.trips })); } catch (e) { /* viewer hook unavailable */ }
if (hot && hot.ready) hot.ready(boot); else boot();
})();
