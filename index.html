<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Train des Animaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;900&display=swap">
<style>
:root {
  /* Layout: one full-bleed canvas landscape; the DOM only holds the ticket, the banner, the album and the parents' corner. */
  --ink: #2b2140;
  --ink-soft: #6b5f86;
  --cream: #fff8e7;
  --berry: #e8436b;
  --berry-deep: #a8234a;
  --mint: #2fb36d;
  --mint-deep: #1d7f4b;
  --sun: #ffc93c;
  --sky: #5cb6ee;
  --font-display: "Grandstander", "Baloo 2", "Chalkboard SE", "Comic Sans MS", ui-rounded, system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--font-display);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.tnum { font-variant-numeric: tabular-nums; }

#corner {
  position: fixed; z-index: 5; display: flex; gap: 8px;
  top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px);
}
.chip {
  height: 46px; min-width: 46px; padding: 0 12px; border: 0; border-radius: 23px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(255, 248, 231, .9); color: var(--ink); cursor: pointer;
  box-shadow: 0 3px 0 rgba(43, 33, 64, .22); font-weight: 700; font-size: 18px;
}
.chip svg { width: 22px; height: 22px; }
.chip .em { font-size: 22px; line-height: 1; }
.chip.bump { animation: bump .6s ease 3; }

#banner {
  position: fixed; z-index: 4; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px);
  transform: translate(-50%, -170%); transition: transform .45s cubic-bezier(.34, 1.56, .64, 1);
  display: flex; align-items: center; gap: 10px; padding: 6px 26px 6px 12px; max-width: calc(100vw - 32px);
  background: var(--cream); color: var(--ink); border-radius: 999px; box-shadow: 0 5px 0 rgba(43, 33, 64, .22);
  font-weight: 900; font-size: clamp(20px, 3.4vw, 38px); white-space: nowrap; pointer-events: none;
}
#banner.show { transform: translate(-50%, 0); }
#banner .em { font-size: 1.3em; line-height: 1; }
.em { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
@media (max-width: 860px) { #banner { top: calc(env(safe-area-inset-top, 0px) + 70px); } }

#title {
  position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding-block: 16px; padding-inline: 16px; cursor: pointer;
}
.ticket {
  display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: min(560px, 100%);
  padding: 14px 24px 16px; background: var(--cream); border-radius: 18px;
  box-shadow: 0 8px 0 rgba(43, 33, 64, .25); transform: rotate(-2deg);
}
.ticket-row {
  display: flex; justify-content: space-between; gap: 18px; width: 100%;
  font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft);
}
.ticket-row.bottom {
  border-top: 3px dashed rgba(43, 33, 64, .22); padding-top: 10px;
  font-size: 15px; letter-spacing: .02em; text-transform: none;
}
.ticket h1 {
  margin: 0; font-weight: 900; line-height: .95; text-align: center; text-wrap: balance;
  font-size: clamp(34px, min(8vw, 11vh), 84px);
}
.ticket h1 span { display: block; color: var(--berry); }
.play {
  width: clamp(96px, 22vmin, 170px); aspect-ratio: 1; border: 0; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: var(--berry); box-shadow: 0 8px 0 var(--berry-deep); animation: pulse 1.3s ease-in-out infinite;
}
.play svg { width: 46%; height: 46%; margin-left: 9%; }
.hint {
  margin: 0; padding: 6px 16px; border-radius: 999px; text-align: center; font-size: 16px;
  background: rgba(43, 33, 64, .72); color: var(--cream);
}

#encore {
  position: fixed; z-index: 5; right: calc(env(safe-area-inset-right, 0px) + 20px); top: 50%; translate: 0 -50%;
  width: clamp(110px, 20vmin, 160px); aspect-ratio: 1; border: 0; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;
  background: var(--mint); color: var(--cream); box-shadow: 0 8px 0 var(--mint-deep);
  font-weight: 900; font-size: clamp(20px, 3.6vmin, 28px); animation: pulse 1.3s ease-in-out infinite;
}
#encore svg { width: 38%; height: auto; margin-left: 6%; }

#album {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(43, 33, 64, .6);
}
.book {
  width: min(940px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y;
  padding: 16px 18px 20px; background: var(--cream); border-radius: 22px; box-shadow: 0 8px 0 rgba(43, 33, 64, .3);
}
.book header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.book h2 { margin: 0; font-weight: 900; font-size: clamp(26px, 4vw, 38px); }
.book h2 small { margin-left: 8px; font-size: .55em; font-weight: 700; color: var(--ink-soft); }
.close {
  border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
  background: var(--berry); color: var(--cream); box-shadow: 0 5px 0 var(--berry-deep); font-weight: 900; font-size: 20px;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; margin-top: 14px; }
.sticker {
  min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px;
  border: 0; border-radius: 16px; background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 rgba(43, 33, 64, .12);
}
.sticker .em { font-size: 44px; line-height: 1.15; }
.sticker .nm { min-height: 1.3em; font-size: 13px; font-weight: 700; line-height: 1.15; text-align: center; }
.sticker.locked { background: rgba(255, 255, 255, .5); }
.sticker.locked .em { filter: brightness(0) opacity(.2); }
.sticker.wiggle { animation: wiggle .5s ease; }

@keyframes pulse { 50% { transform: scale(1.07); } }
@keyframes bump { 50% { transform: scale(1.18); } }
@keyframes wiggle { 25% { transform: rotate(-8deg) scale(1.1); } 75% { transform: rotate(8deg) scale(1.1); } }
@media (prefers-reduced-motion: reduce) {
  .play, #encore, .chip.bump, .sticker.wiggle { animation: none; }
  #banner { transition: none; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Un petit train roule dans la campagne. Touche l’écran pour jouer."></canvas>

<div id="corner">
  <button class="chip" id="albumBtn" type="button" aria-label="Ouvrir l’album des animaux"><span class="em" aria-hidden="true">📖</span><span class="tnum" id="albumCount">0/40</span></button>
  <button class="chip" id="soundBtn" type="button" aria-label="Couper le son"></button>
  <button class="chip" id="fsBtn" type="button" aria-label="Plein écran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="banner" aria-live="polite"><span class="em" id="bannerEm"></span><span id="bannerTx"></span></div>

<div id="title">
  <div class="ticket">
    <div class="ticket-row"><span>Billet</span><span class="tnum" id="tkTrip">Voyage n° 1</span></div>
    <h1>Le Train <span>des Animaux</span></h1>
    <button class="play" id="playBtn" type="button" aria-label="Partir en voyage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8v16.4L20 12z" fill="#fff8e7" stroke="#fff8e7" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
    <div class="ticket-row bottom"><span>Aller simple · gare de la Fête</span><span class="tnum" id="tkAlbum">0 / 40 amis</span></div>
  </div>
  <p class="hint">Touche l’écran ou appuie sur n’importe quelle touche</p>
</div>

<button id="encore" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8v16.4L20 12z" fill="#fff8e7" stroke="#fff8e7" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Encore !</span></button>

<div id="album" role="dialog" aria-modal="true" aria-labelledby="albumTitle" hidden>
  <div class="book">
    <header>
      <h2 id="albumTitle">Mon album <small class="tnum" id="albumTotal"></small></h2>
      <button class="close" id="closeAlbum" type="button">Retour au train</button>
    </header>
    <div class="grid" id="grid"></div>
  </div>
</div>

    [[130.8, 0], [196, .45], [261.6, .95]].forEach(([f, d]) => tone(f, t + d, 0.4, { type: 'triangle', vol: 0.12 }));
  },
  firework() { if (!live()) return; const t = AC.currentTime; hiss(t, 0.5, 0.05, 500, 0.6, 'lowpass'); tone(1200 + rnd(600), t, 0.25, { vol: 0.02, to: 400 }); },
};

/* ---------- voice ---------- */
let voice = null, speechPrimed = false;
const canSpeak = 'speechSynthesis' in window;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^fr[-_]FR/i.test(v.lang) && /google|amélie|amelie|audrey|marie|thomas/i.test(v.name))
      || vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
  } catch (e) { voice = null; }
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, queue) {
  if (muted || !canSpeak) return;
  try {
    if (!queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/’/g, "'"));
    u.lang = 'fr-FR'; if (voice) u.voice = voice; u.rate = 0.95; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch (e) { /* no voice on this device */ }
}
function unlock() {
  initAudio();
  if (canSpeak && !speechPrimed && !muted) {
    speechPrimed = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  }
}

/* ---------- state ---------- */
const LOCO = 210, WAG = 128, GAP = 14, ST_STOP = 95, DEST_STOP = 40, CRUISE = 230, BRAKE = 240;
const G = {
  state: 'title', t: 0, trainPos: 0, speed: 0, boost: 0, lastToot: -9, lastSay: -9,
  biome: BIOMES[0], seed: 1, pal: LOCOS[0], conductor: '🐻', wagons: [], objects: [], route: [], target: null,
  fly: null, dancers: [], timers: [], waitT: 0, callT: 0, partyT: 0, iris: null,
  smoke: [], smokeAcc: 0, sparks: [], confetti: [], confAcc: 0, balloons: [], fireworks: [], fwT: 0, fish: [],
  birds: [], birdT: 5, clouds: [], flakes: [], flies: [], stars: [],
  sunAng: 0, sunSpin: 0, chugD: 0, chugN: 0, rainbow: false,
  seen: new Set(), trips: 0, newFound: [], paused: false,
};
const later = (t, fn) => G.timers.push({ t, fn });

const KEY = 'train-des-animaux:v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ seen: [...G.seen], trips: G.trips, muted })); } catch (e) { /* storage blocked */ } }

/* ---------- layout ---------- */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, GY = 0, FG = 100, FRONT = 0, camX = 0, CUR = 1;
const trainLen = () => LOCO + G.wagons.length * (WAG + GAP);
function relayout() {
  W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(H / 560, W / (trainLen() + 250));
  GY = Math.round(H - Math.max(100 * S, H * 0.2));
  FG = (H - GY) / S;
  FRONT = Math.min(W - 210 * S, Math.max(W * 0.5, (trainLen() + 20) * S));
}
const wsx = x => (x - camX) * S;
const wsy = y => GY + y * S;
const wagonCenter = k => G.trainPos - LOCO - GAP - k * (WAG + GAP) - WAG / 2;

/* ---------- trips ---------- */
function setupTrip(id) {
  const prev = G.biome && G.biome.id;
  G.biome = id ? BIOMES.find(b => b.id === id) : pick(BIOMES.filter(b => b.id !== prev));
  G.seed = rnd(1, 900);
  G.pal = pick(LOCOS.filter(p => p !== G.pal));
  const n = G.trips === 0 ? 3 : (Math.random() < 0.5 ? 3 : 4);
  G.wagons = shuffle(WAGON_COLORS.slice()).slice(0, n).map(([color, cname]) => ({ color, cname, animal: null, hop: 0, squash: 0 }));
  const friends = [...G.seen];
  G.conductor = friends.length ? AN[pick(friends)].e : '🐻';
  G.rainbow = !G.biome.night && !G.biome.snow && Math.random() < 0.4;
  G.objects = []; G.route = []; G.target = null; G.newFound = [];
  initWeather();
  relayout();
}

function chooseAnimals(n) {
  const avail = G.biome.pool.map(id => AN[id]), out = [];
  while (out.length < n && avail.length) {
    const ws = avail.map(a => (a.id === 'licorne' ? 0.35 : 1) * (G.seen.has(a.id) ? 1 : 3));
    let r = Math.random() * ws.reduce((x, y) => x + y, 0), i = 0;
    while (i < ws.length - 1 && r > ws[i]) { r -= ws[i]; i++; }
    out.push(avail.splice(i, 1)[0]);
  }
  return out;
}

function makeEvent(cur) {
  const r = Math.random(), wx = cur + rnd(120, 260);
  if (r < 0.4) return { type: 'tunnel', wx, len: rnd(520, 700) };
  if (r < 0.75) return { type: 'bridge', wx, len: rnd(380, 520), fishT: 0.5 };
  return { type: 'balloons', wx, len: 0 };
}

function planRoute() {
  const n = G.wagons.length, animals = chooseAnimals(n), objs = [];
  let cur = G.trainPos + (W / S) * 0.6 + 500, hadEvent = false;
  for (let i = 0; i < n; i++) {
    if ((i > 0 || Math.random() < 0.3) && (Math.random() < 0.6 || (i === n - 1 && !hadEvent))) {
      const ev = makeEvent(cur); objs.push(ev); cur = ev.wx + ev.len + 380; hadEvent = true;
    }
    const st = { type: 'station', wx: cur + rnd(150, 320), animal: animals[i], done: false, hopT: 0 };
    objs.push(st); cur = st.wx + 520;
  }
  if (!hadEvent) { const ev = makeEvent(cur); objs.push(ev); cur = ev.wx + ev.len + 380; }
  objs.push({ type: 'dest', wx: cur + 500 });
  G.objects = objs;
  G.route = objs.filter(o => o.type === 'station' || o.type === 'dest');
  G.target = G.route[0];
}

function initWeather() {
  const b = G.biome; G.flakes = []; G.flies = []; G.stars = [];
  const w = window.innerWidth, h = window.innerHeight;
  if (b.snow) for (let i = 0; i < (RM ? 30 : 90); i++) G.flakes.push({ x: rnd(w), y: rnd(h), r: rnd(1.5, 4.5), s: rnd(0.6, 1.4), ph: rnd(TAU) });
  if (b.night) {
    for (let i = 0; i < 90; i++) G.stars.push({ x: rnd(1), y: rnd(1), r: rnd(0.6, 1.8), ph: rnd(TAU) });
    for (let i = 0; i < 22; i++) G.flies.push({ x: rnd(w), y: rnd(h * 0.35, h), ph: rnd(TAU), vx: rnd(-12, 12) });
  }
}
function initClouds() {
  G.clouds = Array.from({ length: 6 }, (_, i) => ({ x: i / 6 + rnd(0.1), y: rnd(0.1, 0.5), s: rnd(0.7, 1.25), v: rnd(5, 14) }));
}

/* ---------- game flow ---------- */
function startGame() {
  if (G.state !== 'title') return;
  unlock(); wakeLock();
  titleEl.hidden = true;
  G.state = 'ride';
  planRoute();
  say('C’est parti !'); SFX.whistle(); puff();
}

function arrive() {
  const o = G.target;
  if (o.type !== 'station') { startParty(); return; }
  G.state = 'wait'; G.waitT = 0; G.callT = 0;
  SFX.bell();
  showBanner(o.animal.e, o.animal.n);
  later(0.55, () => { if (G.target === o && G.state === 'wait') { say(`${o.animal.n} ! ${o.animal.s}`); o.hopT = 0.5; } });
}

function board() {
  const o = G.target, k = G.wagons.findIndex(w => !w.animal);
  if (!o || o.type !== 'station' || k < 0 || G.fly) return;
  G.state = 'board'; o.done = true;
  G.fly = { a: o.animal, k, x0: o.wx, y0: -74, x1: wagonCenter(k), y1: -100, t: 0, dur: RM ? 0.6 : 1.05 };
  SFX.boing(); say(`Hop ! Dans le wagon ${G.wagons[k].cname} !`);
}

function land() {
  const f = G.fly; G.fly = null;
  const w = G.wagons[f.k]; w.animal = f.a; w.squash = 1;
  sparkleBurst(f.x1, -112, 16); SFX.land();
  if (!G.seen.has(f.a.id)) { G.seen.add(f.a.id); G.newFound.push(f.a); save(); updateAlbumChip(true); }
  const full = G.wagons.every(x => x.animal);
  later(0.9, () => {
    hideBanner();
    G.target = G.route[G.route.indexOf(G.target) + 1];
    G.state = 'ride'; SFX.whistle(); puff();
    if (full) say('Tout le monde est là ! En route pour la fête !', true);
  });
}

function startParty() {
  G.state = 'party'; G.partyT = 0; G.fwT = 0.6; G.confAcc = 0; G.trips++; save(); updateTicket();
  SFX.fanfare(); say('Youpi ! C’est la fête !');
  showBanner('🎉', 'C’est la fête !');
  const n = G.wagons.length;
  G.wagons.forEach((w, i) => later(0.6 + i * 0.35, () => {
    if (!w.animal) return;
    const a = w.animal; w.animal = null;
    G.dancers.push({ a, i, x0: wagonCenter(i), y0: -100, x1: camX + (W * (i + 1) / (n + 1)) / S, y1: Math.min(FG * 0.55, FG - 40), t: 0, dur: 0.8, hop: 0 });
    SFX.boing(0.8);
  }));
  spawnBalloons(7);
  if (G.newFound.length) {
    const list = G.newFound.map(a => a.e).join(' ');
    later(2.8, () => { if (G.state === 'party') showBanner(list, 'Nouveaux amis !'); });
  }
}

function nextTrip() {
  if (G.iris) return;
  encoreBtn.hidden = true; hideBanner();
  G.iris = { phase: 'close', t: 0 };
  SFX.whistle();
}
function swapTrip() {
  G.dancers = []; G.balloons = []; G.confetti = []; G.fireworks = []; G.sparks = []; G.smoke = []; G.fish = []; G.birds = []; G.timers = [];
  G.trainPos = 0; G.speed = 0; G.boost = 0;
  setupTrip();
  planRoute();
  G.state = 'ride';
  later(0.3, () => { say(G.biome.label); SFX.whistle(); });
}

/* ---------- little reactions ---------- */
function puff() {
  for (let i = 0; i < 5; i++) G.smoke.push({ x: G.trainPos - 51 + rnd(-6, 6), y: -180, vx: rnd(-40, 30), vy: rnd(-110, -60), r: rnd(14, 22), life: 0, max: rnd(1.4, 2) });
}
function toot() {
  puff();
  if (G.t - G.lastToot > 0.5) { G.lastToot = G.t; SFX.whistle(); }
  if (G.state === 'ride') G.boost = Math.min(G.boost + 90, 180);
}
function sayThrottled(text) { if (G.t - G.lastSay > 0.4) { G.lastSay = G.t; say(text); } }
function sparkleBurst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), sp = rnd(80, 220);
    G.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0, max: rnd(0.6, 1), c: pick(['#ffd23f', '#fff8e7', '#ff8fab', '#8fd3ff']), r: rnd(6, 11) });
  }
}
function confettiBurst(x, y, n, c) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), sp = rnd(120, 300);
    G.confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, rot: rnd(TAU), vr: rnd(-8, 8), c: c || pick(PARTY_COLORS), w: rnd(6, 10), h: rnd(9, 15), life: 0, max: 2.4 });
  }
}
function spawnBalloons(n) {
  for (let i = 0; i < n; i++) G.balloons.push({ x: rnd(W * 0.25, W * 0.95), y: H + rnd(30, 260), r: clamp(32 * S, 22, 60), c: pick(PARTY_COLORS), vy: rnd(55, 95) * Math.max(0.7, S), ph: rnd(TAU) });
}
function firework() {
  const cx = rnd(W * 0.12, W * 0.88), cy = rnd(GY * 0.12, GY * 0.5), c = pick(PARTY_COLORS.concat('#ffffff'));
  const n = RM ? 14 : 30, sp = rnd(110, 180) * Math.max(S, 0.7);
  for (let i = 0; i < n; i++) { const a = i / n * TAU, k = rnd(0.8, 1); G.fireworks.push({ x: cx, y: cy, vx: Math.cos(a) * sp * k, vy: Math.sin(a) * sp * k, life: 0, max: rnd(1, 1.4), c }); }
  SFX.firework();
}

/* ---------- update ---------- */
function update(dt) {
  G.t += dt;
  if (G.timers.length) {
    const due = [];
    G.timers = G.timers.filter(tm => { tm.t -= dt; if (tm.t <= 0) { due.push(tm); return false; } return true; });
    due.forEach(tm => tm.fn());
  }

  // train
  if (G.state === 'title') {
    G.speed += (120 - G.speed) * Math.min(1, dt);
    G.trainPos += G.speed * dt;
  } else if (G.state === 'ride' && G.target) {
    const stopAt = G.target.wx - (G.target.type === 'dest' ? DEST_STOP : ST_STOP);
    G.boost *= Math.exp(-dt * 1.3);
    G.speed += (CRUISE + G.boost - G.speed) * Math.min(1, dt * 0.9);
    G.speed = Math.min(G.speed, Math.sqrt(2 * BRAKE * Math.max(0, stopAt - G.trainPos)) + 4);
    G.trainPos = Math.min(stopAt, G.trainPos + G.speed * dt);
    if (stopAt - G.trainPos < 0.5) { G.trainPos = stopAt; G.speed = 0; arrive(); }
  } else {
    G.speed = 0;
  }
  if (G.speed > 12) {
    G.chugD += G.speed * dt;
    if (G.chugD > 74) { G.chugD = 0; SFX.chug(G.chugN++ % 2 === 0, G.speed); }
  }

  // smoke
  G.smokeAcc += dt * (1.5 + G.speed / 40);
  while (G.smokeAcc > 1) {
    G.smokeAcc -= 1;
    G.smoke.push({ x: G.trainPos - 51 + rnd(-4, 4), y: -178, vx: rnd(-14, 6), vy: rnd(-50, -30), r: rnd(9, 14), life: 0, max: rnd(1.6, 2.4) });
  }
  for (const p of G.smoke) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy *= 1 - dt * 0.3; p.r += dt * 16; }
  G.smoke = G.smoke.filter(p => p.life < p.max);

  // stations
  if (G.state === 'wait' && G.target) {
    G.waitT += dt; G.callT += dt;
    if (G.callT > 7) { G.callT = 0; say(G.target.animal.s); SFX.boing(0.6); G.target.hopT = 0.5; }
  }
  for (const o of G.objects) if (o.hopT > 0) o.hopT = Math.max(0, o.hopT - dt);
  if (G.fly) { G.fly.t += dt; if (G.fly.t >= G.fly.dur) land(); }
  for (const w of G.wagons) { w.hop = Math.max(0, w.hop - dt * 2); w.squash = Math.max(0, w.squash - dt * 2.5); }

  // party
  if (G.state === 'party') {
    G.partyT += dt;
    G.fwT -= dt; if (G.fwT <= 0) { G.fwT = rnd(0.5, 1); firework(); }
    G.confAcc += dt * (G.partyT < 4 ? (RM ? 6 : 26) : 6);
    while (G.confAcc > 1) {
      G.confAcc -= 1;
      G.confetti.push({ x: rnd(W), y: -10, vx: rnd(-30, 30), vy: rnd(40, 120), rot: rnd(TAU), vr: rnd(-6, 6), c: pick(PARTY_COLORS), w: rnd(6, 10), h: rnd(9, 15), life: 0, max: 9 });
    }
    if (G.partyT > 2.5 && encoreBtn.hidden && !G.iris) encoreBtn.hidden = false;
    if (G.partyT > 20) nextTrip();
  }
  for (const d of G.dancers) { d.t += dt; d.hop = Math.max(0, d.hop - dt * 2); }

  // route events
  for (const o of G.objects) {
    if (o.type === 'tunnel') {
      if (!o.in && G.trainPos > o.wx) { o.in = true; SFX.whistle(); }
      if (!o.out && G.trainPos > o.wx + o.len + 10) { o.out = true; say('Coucou !'); }
    } else if (o.type === 'balloons') {
      if (!o.fired && G.trainPos > o.wx) { o.fired = true; spawnBalloons(5); }
    } else if (o.type === 'bridge') {
      if (wsx(o.wx) < W && wsx(o.wx + o.len) > 0) {
        o.fishT -= dt;
        if (o.fishT <= 0) {
          o.fishT = rnd(0.8, 1.8);
          G.fish.push({ x: rnd(o.wx + 40, o.wx + o.len - 40), t: 0, dur: rnd(0.8, 1.1), h: rnd(60, 95), e: pick(['🐟', '🐠']), dir: Math.random() < 0.5 ? -1 : 1 });
        }
      }
    }
  }
  for (const f of G.fish) f.t += dt;
  G.fish = G.fish.filter(f => f.t < f.dur);

  // particles
  for (const s of G.sparks) { s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * dt; }
  G.sparks = G.sparks.filter(s => s.life < s.max);
  for (const c of G.confetti) {
    c.life += dt; c.vy = Math.min(c.vy + 320 * dt, 160); c.vx *= 1 - dt * 0.8;
    c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
  }
  G.confetti = G.confetti.filter(c => c.life < c.max && c.y < H + 30);
  for (const b of G.balloons) { b.y -= b.vy * dt; b.x += (Math.sin(G.t * 1.6 + b.ph) * 16 - G.speed * S * 0.12) * dt; }
  G.balloons = G.balloons.filter(b => b.y > -b.r * 4 && b.x > -b.r * 3);
  for (const f of G.fireworks) {
    f.life += dt; f.vy += 70 * dt; f.vx *= 1 - dt * 1.2; f.vy *= 1 - dt * 1.2; f.x += f.vx * dt; f.y += f.vy * dt;
  }
  G.fireworks = G.fireworks.filter(f => f.life < f.max);

  // sky life
  if (!G.biome.night) {
    G.birdT -= dt;
    if (G.birdT <= 0) { G.birdT = rnd(9, 18); G.birds.push({ x: W + 40, y: rnd(GY * 0.12, GY * 0.42), n: 3 + (Math.random() * 3 | 0), v: rnd(45, 75) }); }
  }
  for (const b of G.birds) b.x -= (b.v + G.speed * S * 0.08) * dt;
  G.birds = G.birds.filter(b => b.x > -260);
  for (const f of G.flakes) {
    f.y += (25 + f.r * 12) * f.s * dt; f.x -= (G.speed * S * 0.4 + 10) * dt + Math.sin(G.t + f.ph) * 6 * dt;
    if (f.y > H + 5) { f.y = -5; f.x = rnd(W); }
    if (f.x < -5) f.x += W + 10;
  }
  for (const f of G.flies) {
    f.x = mod(f.x + (f.vx - G.speed * S * 0.5) * dt, W);
    f.y += Math.sin(G.t * 1.3 + f.ph) * 10 * dt;
  }
  G.sunSpin = Math.max(0, G.sunSpin - dt * 0.8);
  G.sunAng += dt * (0.15 + G.sunSpin * 9);

  // transition
  if (G.iris) {
    G.iris.t += dt;
    if (G.iris.t >= (RM ? 0.25 : 0.75)) {
      if (G.iris.phase === 'close') { swapTrip(); G.iris = { phase: 'open', t: 0 }; } else G.iris = null;
    }
  }

  // forget scenery far behind
  if (G.objects.length && G.objects[0].wx + (G.objects[0].len || 0) + 900 < camX && G.objects[0] !== G.target) G.objects.shift();
}

/* ---------- drawing primitives ---------- */
function toWorld() { ctx.setTransform(DPR * S, 0, 0, DPR * S, -camX * S * DPR, GY * DPR); CUR = S; }
function toScreen() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); CUR = 1; }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function tri(a, b, c, d, e, f) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function star(x, y, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, k = i % 2 ? r * 0.42 : r; ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k); }
  ctx.closePath(); ctx.fill();
}

const EMO_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const emoCache = new Map();
function emojiImg(e, px) {
  px = Math.max(8, Math.round(px / 4) * 4);
  const key = e + '|' + px;
  let c = emoCache.get(key);
  if (!c) {
    c = document.createElement('canvas');
    const pad = Math.ceil(px * 0.25);
    c.width = c.height = px + pad * 2; c._px = px;
    const g = c.getContext('2d');
    g.font = `${px}px ${EMO_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(e, c.width / 2, c.height / 2 + px * 0.06);
    emoCache.set(key, c);
    if (emoCache.size > 300) emoCache.delete(emoCache.keys().next().value);
  }
  return c;
}
// Draws an emoji centred on (x, y); size is in the current units (world units or CSS px).
function drawEmoji(e, x, y, size, o) {
  const img = emojiImg(e, size * CUR * DPR), k = size / img._px, w = img.width * k, h = img.height * k;

/* ---------- the train ---------- */
function wheel(x, y, r, ang, rim) {
  circle(x, y, r); ctx.fillStyle = '#2b2140'; ctx.fill();
  circle(x, y, r * 0.74); ctx.fillStyle = rim; ctx.fill();
  ctx.strokeStyle = '#2b2140'; ctx.lineWidth = Math.max(2, r * 0.12); ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = ang + i * Math.PI / 3; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * 0.74, y + Math.sin(a) * r * 0.74); }
  ctx.stroke();
  circle(x, y, r * 0.2); ctx.fillStyle = '#2b2140'; ctx.fill();
}
function drawTrain() {
  const x0 = G.trainPos, pal = G.pal, moving = G.speed > 3;
  const bob = moving ? Math.sin(G.trainPos * 0.11) * 1.4 : 0;
  G.wagons.forEach((w, k) => {
    const right = x0 - LOCO - GAP - k * (WAG + GAP), left = right - WAG, cx = left + WAG / 2, by = k % 2 ? -bob : bob;
    ctx.fillStyle = '#2b2140'; ctx.fillRect(right - 4, -50, GAP + 8, 6);
    wheel(left + 30, -19, 19, x0 / 19, '#c9ced8'); wheel(right - 30, -19, 19, x0 / 19 + 1, '#c9ced8');
    if (w.animal) {
      const hop = w.hop > 0 ? -Math.sin((1 - w.hop) * Math.PI) * 46 : 0;
      const land = w.squash > 0 ? Math.sin(w.squash * Math.PI) * 10 : 0;
      const idle = moving ? Math.sin(G.t * 7 + k * 1.7) * 2.5 : Math.sin(G.t * 2 + k) * 1.5;
      drawEmoji(w.animal.e, cx, -100 + by + hop + land + idle, 68, { flip: true });
    }
    rr(left, -92 + by, WAG, 58, 12); ctx.fillStyle = w.color; ctx.fill();
    ctx.fillStyle = shade(w.color, -0.22); rr(left - 5, -98 + by, WAG + 10, 12, 6); ctx.fill();
    ctx.fillStyle = shade(w.color, 0.28); rr(left + 12, -72 + by, WAG - 24, 8, 4); ctx.fill();
    ctx.fillStyle = shade(w.color, -0.25);
    for (let i = 0; i < 4; i++) { circle(left + 20 + i * (WAG - 40) / 3, -48 + by, 3); ctx.fill(); }
  });

  const by = bob * 0.6;
  wheel(x0 - 38, -15, 15, x0 / 15, pal.trim);
  wheel(x0 - 150, -27, 27, x0 / 27, pal.trim); wheel(x0 - 92, -27, 27, x0 / 27, pal.trim);
  ctx.fillStyle = '#2b2140'; rr(x0 - 208, -54, 196, 18, 6); ctx.fill();
  ctx.fillStyle = pal.cab; tri(x0 - 16, -40, x0 + 14, -6, x0 - 16, -6);
  ctx.fillStyle = pal.body; rr(x0 - 132, -122 + by, 112, 72, 22); ctx.fill();
  ctx.fillStyle = shade(pal.body, 0.22); rr(x0 - 126, -114 + by, 100, 12, 6); ctx.fill();
  ctx.fillStyle = pal.trim; ctx.fillRect(x0 - 112, -122 + by, 8, 72); ctx.fillRect(x0 - 74, -122 + by, 8, 72);
  ctx.fillStyle = '#2b2140'; rr(x0 - 34, -118 + by, 22, 64, 9); ctx.fill();
  ctx.fillStyle = pal.trim; ctx.beginPath(); ctx.arc(x0 - 92, -122 + by, 16, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#2b2140'; ctx.beginPath();
  ctx.moveTo(x0 - 62, -120 + by); ctx.lineTo(x0 - 58, -152 + by); ctx.lineTo(x0 - 70, -170 + by);
  ctx.lineTo(x0 - 32, -170 + by); ctx.lineTo(x0 - 44, -152 + by); ctx.lineTo(x0 - 40, -120 + by); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pal.trim; ctx.fillRect(x0 - 72, -174 + by, 42, 6);
  circle(x0 - 20, -130 + by, 10); ctx.fill();
  circle(x0 - 17, -130 + by, 6); ctx.fillStyle = '#fffbe6'; ctx.fill();
  ctx.fillStyle = pal.cab; rr(x0 - 208, -170 + by, 86, 120, 8); ctx.fill();
  ctx.fillStyle = G.biome.night ? '#ffe9a6' : '#fff8e7'; rr(x0 - 194, -152 + by, 54, 44, 10); ctx.fill();
  ctx.save(); rr(x0 - 194, -152 + by, 54, 44, 10); ctx.clip();
  drawEmoji(G.conductor, x0 - 167, -120 + by, 46, { flip: true }); ctx.restore();
  ctx.fillStyle = shade(pal.cab, -0.3); rr(x0 - 218, -184 + by, 106, 18, 9); ctx.fill();
  ctx.fillStyle = pal.trim; ctx.fillRect(x0 - 208, -92 + by, 86, 8);
  const a = x0 / 27, p1x = x0 - 150 + Math.cos(a) * 14, p1y = -27 + Math.sin(a) * 14, p2x = x0 - 92 + Math.cos(a) * 14, p2y = -27 + Math.sin(a) * 14;
  ctx.fillStyle = '#2b2140'; rr(x0 - 66, -48, 30, 18, 5); ctx.fill();
  ctx.strokeStyle = '#d9dde5'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y); ctx.lineTo(x0 - 50, -39); ctx.stroke();
  ctx.fillStyle = '#2b2140'; circle(p1x, p1y, 4); ctx.fill(); circle(p2x, p2y, 4); ctx.fill();
}
function drawHeadlamp() {
  const x = G.trainPos - 17, y = -130, g = ctx.createRadialGradient(x, y, 4, x, y, 460);
  g.addColorStop(0, 'rgba(255,236,160,.5)'); g.addColorStop(1, 'rgba(255,236,160,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 460, y - 120); ctx.lineTo(x + 460, y + 150); ctx.closePath(); ctx.fill();
}
function drawSmoke() {
  const rgb = G.biome.night ? '190,200,235' : G.biome.snow ? '205,212,228' : '255,255,255', k = G.biome.night ? 0.45 : 0.85;
  for (const p of G.smoke) { ctx.fillStyle = `rgba(${rgb},${(1 - p.life / p.max) * k})`; circle(p.x, p.y, p.r); ctx.fill(); }
}
function drawFly() {
  const f = G.fly; if (!f) return;
  const p = clamp(f.t / f.dur, 0, 1);
  drawEmoji(f.a.e, lerp(f.x0, f.x1, p), lerp(f.y0, f.y1, p) - Math.sin(Math.PI * p) * 250, lerp(76, 68, p), { rot: RM ? 0 : p * TAU, flip: p > 0.5 });
}
function drawDancers() {
  for (const d of G.dancers) {
    const p = clamp(d.t / d.dur, 0, 1);
    let x, y, rot;
    if (p < 1) { x = lerp(d.x0, d.x1, p); y = lerp(d.y0, d.y1, p) - Math.sin(Math.PI * p) * 170; rot = RM ? 0 : p * TAU; }
    else {
      const ph = G.t * 6 + d.i * 1.3;
      x = d.x1; rot = RM ? 0 : Math.sin(ph) * 0.18;
      y = d.y1 - (RM ? 0 : Math.abs(Math.sin(ph)) * 20) - (d.hop > 0 ? Math.sin((1 - d.hop) * Math.PI) * 60 : 0);
      ctx.fillStyle = 'rgba(43,33,64,.18)'; ctx.beginPath(); ctx.ellipse(x, d.y1 + 28, 24, 6, 0, 0, TAU); ctx.fill();
    }
    drawEmoji(d.a.e, x, y, 62, { rot, flip: d.i % 2 === 0 });
  }
}
function dancerPos(d) { return { x: wsx(d.x1), y: wsy(d.y1) }; }
function drawFish() {
  const base = Math.min(FG * 0.55, 70);
  for (const f of G.fish) {
    const p = f.t / f.dur;
    drawEmoji(f.e, f.x + f.dir * p * 40, base - Math.sin(Math.PI * p) * f.h, 34, { rot: (p - 0.5) * 1.6 * f.dir, flip: f.dir > 0 });
  }
}
function drawSparks() { for (const s of G.sparks) { ctx.globalAlpha = 1 - s.life / s.max; star(s.x, s.y, s.r, s.c); } ctx.globalAlpha = 1; }

/* ---------- screen-space overlays ---------- */
function drawBunting() {
  if (G.state !== 'party') return;
  const sag = 40 * Math.max(S, 0.7), n = Math.ceil(W / 40), yAt = t => 6 + 4 * t * (1 - t) * sag;
  ctx.strokeStyle = 'rgba(43,33,64,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.quadraticCurveTo(W / 2, 6 + sag * 2, W, 6); ctx.stroke();
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, x = t * W, y = yAt(t), sw = Math.sin(G.t * 3 + i) * 3;
    ctx.fillStyle = PARTY_COLORS[i % PARTY_COLORS.length]; tri(x - 12, y, x + 12, y, x + sw, y + 24);
  }
}
function drawBalloons() {
  for (const b of G.balloons) {
    ctx.strokeStyle = 'rgba(43,33,64,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(b.x, b.y + b.r); ctx.quadraticCurveTo(b.x + Math.sin(G.t * 3 + b.ph) * 8, b.y + b.r * 1.8, b.x, b.y + b.r * 2.6); ctx.stroke();
    ctx.fillStyle = b.c; ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * 0.86, b.r, 0, 0, TAU); ctx.fill();
    tri(b.x, b.y + b.r - 2, b.x - 6, b.y + b.r + 7, b.x + 6, b.y + b.r + 7);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.32, b.y - b.r * 0.38, b.r * 0.18, b.r * 0.3, -0.5, 0, TAU); ctx.fill();
  }
}
function drawConfetti() {
  for (const c of G.confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.c;
    ctx.fillRect(-c.w / 2, -c.h / 2 * Math.abs(Math.cos(c.rot * 1.7)), c.w, c.h * Math.abs(Math.cos(c.rot * 1.7)) + 1);
    ctx.restore();
  }
}
function drawFireworks() {
  if (G.biome.night) ctx.globalCompositeOperation = 'lighter';
  const r = 3 * Math.max(S, 0.7);
  for (const f of G.fireworks) { ctx.globalAlpha = 1 - f.life / f.max; ctx.fillStyle = f.c; circle(f.x, f.y, r); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawWeather() {
  if (G.flakes.length) { ctx.fillStyle = 'rgba(255,255,255,.9)'; for (const f of G.flakes) { circle(f.x, f.y, f.r); ctx.fill(); } }
  for (const f of G.flies) {
    const a = 0.5 + 0.5 * Math.sin(G.t * 3 + f.ph);
    ctx.fillStyle = `rgba(255,236,120,${0.15 * a})`; circle(f.x, f.y, 10); ctx.fill();
    ctx.fillStyle = `rgba(255,246,190,${0.4 + 0.6 * a})`; circle(f.x, f.y, 2.5); ctx.fill();
  }
}
function drawHint() {
  if (G.state !== 'wait' || G.waitT < 3 || !G.target) return;
  const ax = wsx(G.target.wx), ay = wsy(-74), p = (G.t * 1.2) % 1;
  ctx.strokeStyle = `rgba(255,248,231,${1 - p})`; ctx.lineWidth = 5; circle(ax, ay, (40 + p * 40) * S); ctx.stroke();
  drawEmoji('👆', ax + 26 * S, ay + 62 * S + Math.sin(G.t * 6) * 8 * S, 54 * S);
}
function drawIris() {
  if (!G.iris) return;
  const p = clamp(G.iris.t / (RM ? 0.25 : 0.75), 0, 1), R = Math.hypot(W, H);
  const r = G.iris.phase === 'close' ? R * (1 - p) * (1 - p) : R * p * p;
  const cx = FRONT - 100 * S, cy = GY - 90 * S;
  ctx.fillStyle = '#2b2140'; ctx.beginPath(); ctx.rect(0, 0, W, H);
  ctx.moveTo(cx + Math.max(r, 0.1), cy); ctx.arc(cx, cy, Math.max(r, 0.1), 0, TAU, true); ctx.fill('evenodd');
}

function render() {
  camX = G.trainPos - FRONT / S;
  toScreen();
  drawSky(); drawSun(); drawRainbow(); drawClouds(); drawFar(); drawHills();
  ctx.fillStyle = G.biome.ground; ctx.fillRect(0, GY, W, H - GY + 1);
  toWorld();
  drawTrees(); drawBehind(); drawBridges(); drawTrack(); drawFG();
  if (G.biome.night) drawHeadlamp();
  drawFly(); drawTrain(); drawSmoke(); drawTunnelFronts();
  drawDancers(); drawFish(); drawSparks();
  toScreen();
  drawBunting(); drawBirds(); drawFireworks(); drawBalloons(); drawConfetti(); drawWeather(); drawHint(); drawIris();
}

/* ---------- taps ---------- */
function popBalloonAt(x, y) {
  for (let i = G.balloons.length - 1; i >= 0; i--) {
    const b = G.balloons[i];
    if (Math.hypot(x - b.x, y - b.y) < b.r * 1.25) { G.balloons.splice(i, 1); confettiBurst(b.x, b.y, 18, b.c); SFX.pop(); return true; }
  }
  return false;
}
function tapWagon(x, y) {
  for (let k = 0; k < G.wagons.length; k++) {
    const w = G.wagons[k], c = wagonCenter(k);
    if (!w.animal) continue;
    if (x > wsx(c - WAG / 2) && x < wsx(c + WAG / 2) && y > wsy(-150) && y < wsy(-34)) {
      w.hop = 1; SFX.boing(0.7); sayThrottled(w.animal.s); return true;
    }
  }
  return false;
}
function tapDancer(x, y) {
  for (const d of G.dancers) {
    if (d.t < d.dur) continue;
    const p = dancerPos(d);
    if (Math.hypot(x - p.x, y - p.y) < 50 * S) { d.hop = 1; SFX.boing(0.7); sayThrottled(d.a.s); return true; }
  }
  return false;
}
function tapSun(x, y) {
  const p = sunPos();
  if (Math.hypot(x - p.x, y - p.y) > p.r * 1.4) return false;
  G.sunSpin = 1; SFX.sparkle();
  sayThrottled(G.biome.night ? 'Bonne nuit la lune !' : 'Bonjour soleil !');
  return true;
}
function action(x, y) {
  initAudio();
  if (!albumEl.hidden) return;
  if (G.state === 'title') { startGame(); return; }
  if (G.iris) return;
  const at = x != null;
  if (at && popBalloonAt(x, y)) return;
  if (G.state === 'wait') { board(); return; }
  if (G.state === 'party') {
    if (at && tapDancer(x, y)) return;
    if (at) { confettiBurst(x, y, 16); SFX.sparkle(); return; }
    if (G.partyT > 2.5) nextTrip();
    return;
  }
  if (at && (tapWagon(x, y) || tapSun(x, y))) return;
  toot();
}

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const titleEl = $('title'), encoreBtn = $('encore'), albumEl = $('album'), bannerEl = $('banner');
const albumBtn = $('albumBtn'), soundBtn = $('soundBtn'), fsBtn = $('fsBtn');
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

function showBanner(em, text) { $('bannerEm').textContent = em; $('bannerTx').textContent = text; bannerEl.classList.add('show'); }
function hideBanner() { bannerEl.classList.remove('show'); }
function updateTicket() {
  $('tkTrip').textContent = `Voyage n° ${G.trips + 1}`;
  $('tkAlbum').textContent = `${G.seen.size} / ${ANIMALS.length} amis`;
}
function updateAlbumChip(bump) {
  $('albumCount').textContent = `${G.seen.size}/${ANIMALS.length}`;
  if (bump && !RM) { albumBtn.classList.remove('bump'); void albumBtn.offsetWidth; albumBtn.classList.add('bump'); }
}
function setMuted(m) {
  muted = m;
  if (MASTER) MASTER.gain.value = m ? 0 : 0.8;
  if (m && canSpeak) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  soundBtn.innerHTML = m ? ICON_OFF : ICON_ON;
  soundBtn.setAttribute('aria-label', m ? 'Remettre le son' : 'Couper le son');
}
function buildAlbum() {
  const grid = $('grid'); grid.textContent = '';
  for (const a of ANIMALS) {
    const found = G.seen.has(a.id), b = document.createElement('button');
    b.type = 'button'; b.className = 'sticker' + (found ? '' : ' locked');
    b.innerHTML = `<span class="em" aria-hidden="true">${a.e}</span><span class="nm">${found ? a.n : '?'}</span>`;
    b.setAttribute('aria-label', found ? a.n : 'Animal pas encore trouvé');
    b.addEventListener('click', () => {
      unlock();
      say(found ? `${a.n} ! ${a.s}` : 'Mystère ! Pars en voyage pour le trouver.');
      b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle');
    });
    grid.append(b);
  }
  $('albumTotal').textContent = `${G.seen.size} / ${ANIMALS.length}`;
}
function openAlbum() { unlock(); buildAlbum(); albumEl.hidden = false; G.paused = true; $('closeAlbum').focus(); }
function closeAlbum() { albumEl.hidden = true; G.paused = false; }

let wl = null;
async function wakeLock() {
  try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } }
  catch (e) { wl = null; }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); action(e.clientX, e.clientY); });
titleEl.addEventListener('click', () => { unlock(); startGame(); });
encoreBtn.addEventListener('click', () => { unlock(); nextTrip(); });
albumBtn.addEventListener('click', openAlbum);
$('closeAlbum').addEventListener('click', closeAlbum);
albumEl.addEventListener('click', e => { if (e.target === albumEl) closeAlbum(); });
soundBtn.addEventListener('click', () => { unlock(); setMuted(!muted); save(); });
const fsOK = document.fullscreenEnabled || document.webkitFullscreenEnabled;
if (!fsOK) fsBtn.hidden = true;
fsBtn.addEventListener('click', () => {
  const d = document;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const el = d.documentElement, p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { /* not allowed here */ }
});
// Touch only counts as a user gesture on release, so sound is unlocked there too.
['pointerup', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, unlock, true));
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key) || e.key === 'Tab') return;
  if (!albumEl.hidden) { if (e.key === 'Escape') closeAlbum(); return; }
  e.preventDefault();
  if (e.repeat) return;
  if (G.state === 'title') { unlock(); startGame(); } else action(null, null);
});
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) { if (AC.suspend) AC.suspend(); }
  else { initAudio(); if (G.state !== 'title') wakeLock(); }
});
window.addEventListener('resize', relayout);

/* ---------- boot ---------- */
let last = 0;
function frame(ts) {
  const now = ts / 1000, dt = last ? Math.min(0.05, now - last) : 0.016; last = now;
  if (!G.paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
function boot() {
  const saved = load();
  (saved.seen || []).forEach(id => { if (AN[id]) G.seen.add(id); });
  G.trips = saved.trips | 0;
  setMuted(!!saved.muted);
  setupTrip('ferme');
  initClouds();
  updateAlbumChip(false); updateTicket();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) try { hot.snapshot(() => ({ trips: G.trips })); } catch (e) { /* viewer hook unavailable */ }
if (hot && hot.ready) hot.ready(boot); else boot();
})();
</script>
